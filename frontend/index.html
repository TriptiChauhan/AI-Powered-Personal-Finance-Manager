<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AuraFinance - A next-generation, responsive, AI-Powered Expense Tracker. Log transactions, visualize category breakdowns and trend data, and receive automated financial coaching insights." />
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <title>AuraFinance - AI-Powered Expense Tracker</title>

    <!-- Theme Initializer (Prevents Flicker) -->
    <script>
      (function() {
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = saved || (prefersDark ? 'dark' : 'light');
        if (theme === 'light') {
          document.documentElement.classList.add('light-theme');
          document.documentElement.classList.remove('dark');
          document.documentElement.style.backgroundColor = '#f3f4f6';
          const style = document.createElement('style');
          style.innerHTML = 'body { background-color: #f3f4f6 !important; }';
          document.head.appendChild(style);
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light-theme');
          document.documentElement.style.backgroundColor = '#0a0f1d';
          const style = document.createElement('style');
          style.innerHTML = 'body { background-color: #0a0f1d !important; }';
          document.head.appendChild(style);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
